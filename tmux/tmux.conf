# tmux config — managed by ~/dotfiles
# ~/.tmux.conf is a symlink to ~/dotfiles/tmux/tmux.conf (created by install.sh).
#
# Key concepts:
#   - "prefix" is the key you press before any tmux command (like a leader key).
#     Default is Ctrl-b, but we rebind it to Ctrl-a (easier to reach).
#   - After pressing prefix, you press a second key for the action:
#       prefix + r   → reload this config
#       prefix + |   → split pane horizontally
#       prefix + _   → split pane vertically
#       prefix + c   → new window
#       prefix + [   → enter copy mode (scroll/select text)
#       prefix + I   → install tmux plugins (via tpm)
#   - C-h/j/k/l navigates between tmux panes AND vim splits seamlessly
#     (no prefix needed, handled by vim-tmux-navigator).

# ----------------------------------------------------------------
# Prefix key: rebind from Ctrl-b to Ctrl-a
# ----------------------------------------------------------------
unbind C-b              # remove the default prefix binding
set -g prefix C-a       # set Ctrl-a as the new prefix
bind C-a send-prefix    # pressing Ctrl-a twice sends a literal Ctrl-a
                        # (useful if a program inside tmux needs Ctrl-a)

# ----------------------------------------------------------------
# Reload config
# ----------------------------------------------------------------
# tmux only reads .tmux.conf at startup. This binding lets you reload
# after editing without restarting tmux. Press: prefix + r
unbind r
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# --------------------------------------
# Seamless Vim/tmux pane navigation
# --------------------------------------
# This is the tmux half of vim-tmux-navigator (the Vim half is the
# 'christoomey/vim-tmux-navigator' plugin in vimrc).
#
# Problem: C-h/j/k/l should move between tmux panes, but if the
# current pane is running Vim, those keys should move between Vim splits.
#
# Solution: Before switching panes, tmux checks if the current pane is
# running Vim. If yes → forward the keypress to Vim. If no → switch pane.
#
# The is_vim variable uses `ps` to check if the process in the current
# pane is vim/nvim/view/vimdiff. The -n flag means no prefix key needed.
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
	| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# C-\ handling changed in tmux 3.0 (backslash escaping), so we need
# version-specific bindings
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
	"bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
	"bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Also allow pane navigation while in copy mode (scrolling through history)
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# --------------------------------------

# --------------------------------------
# Terminal and colors
# --------------------------------------
# Tell tmux what terminal capabilities are available. "tmux-256color"
# enables 256 colors and italics. This must match what your outer
# terminal (iTerm2/Ghostty) supports.
set -g default-terminal "tmux-256color"
# Tc = true color (24-bit). This tells tmux that xterm-termite supports
# true color, so Vim's termguicolors (gruvbox) renders correctly.
set -ga terminal-overrides ",xterm-termite:Tc"

# --------------------------------------
# Status bar
# --------------------------------------
# The status bar is the line at the bottom of tmux showing windows,
# session name, and (on the right) date/time.
set-option -g status-bg '#666666'       # dark gray background
set-option -g status-fg '#aaaaaa'       # light gray text
set-option -g status-left-length 50     # allow longer session names
set-option -g status-right " #(date '+%a, %b %d - %I:%M') "
# --------------------------------------

# --------------------------------------
# Splitting / Creating Panes
# --------------------------------------
# Default tmux splits: prefix+" (horizontal), prefix+% (vertical) — hard to remember.
# These rebind to more intuitive keys:
#   prefix + |  → split side-by-side (horizontal split, -h)
#   prefix + _  → split top-and-bottom (vertical split, -v)
# -c '#{pane_current_path}' keeps the new pane in the same directory.
bind-key | split-window -h -c '#{pane_current_path}'
bind-key _ split-window -v -c '#{pane_current_path}'
# --------------------------------------
 
# --------------------------------------
# Copy Mode
# --------------------------------------
# Copy mode lets you scroll through terminal output and copy text.
# Enter copy mode: prefix + [
# Navigate with vim keys (h/j/k/l, Ctrl-u/d for page up/down)
# Select text, yank it, then paste with prefix + ]
#
# Workflow:  prefix+[  →  navigate  →  v (select)  →  y (yank)  →  prefix+] (paste)
setw -g mode-keys vi    # use vim keybindings in copy mode (not emacs)

bind-key -T copy-mode-vi 'v' send-keys -X begin-selection       # v to start selecting
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel  # y to yank and exit
# --------------------------------------

# --------------------------------------
# Pane/session management
# --------------------------------------
# prefix + j → prompts for a window number, then pulls that window's pane
#              into the current window as a side-by-side split.
#              Useful for combining panes from different windows.
bind-key j command-prompt -p "join pane from: "  "join-pane -h -s '%%'"

# prefix + s → shows pane numbers, then prompts for a pane number to swap
#              with the current pane. Useful for rearranging pane positions.
bind-key s display-panes\; command-prompt -p "pane #: "  "swap-pane -t '%%'"

# prefix + K → kill current session and switch to the next one (instead
#              of disconnecting from tmux entirely, which is the default).
bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'
# --------------------------------------

# --------------------------------------
# General settings
# --------------------------------------
# Without this, tmux waits ~500ms after Esc to see if it's part of a
# key sequence. Set to 0 so Vim mode switching feels instant.
set -s escape-time 0

# By default, windows and panes are numbered starting from 0.
# Starting from 1 matches keyboard layout (1 is leftmost number key).
set -g base-index 1         # windows start at 1
setw -g pane-base-index 1   # panes start at 1
set -g renumber-windows on  # if you close window 2, window 3 becomes 2

# Prevent tmux from renaming windows based on the running command.
# Once you name a window (prefix + ,), it keeps that name.
set-option -g allow-rename off

# prefix + c creates a new window. By default it opens in $HOME.
# This override keeps the same directory as the current pane.
bind c new-window -c "#{pane_current_path}"
# --------------------------------------


# ==========================================
# Plugin Manager (tpm)
# ==========================================
# tpm (Tmux Plugin Manager) works like vim-plug but for tmux.
# Add plugins with: set -g @plugin 'github-user/repo'
# Install them with: prefix + I (capital i)
# Update them with:  prefix + U
# This line must stay at the very bottom of tmux.conf.
set -g @plugin 'tmux-plugins/tpm'

# Initialize tpm — must be the last line
run '~/.tmux/plugins/tpm/tpm'
